<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 方案5: 极简风格 - 浏览器框架+列表+× -->
  <defs>
    <linearGradient id="browserGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097A7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow5">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 浏览器框架 -->
  <rect x="16" y="16" width="96" height="96" rx="4" fill="url(#browserGrad5)" stroke="#00838F" stroke-width="2"/>
  
  <!-- 浏览器顶部栏 -->
  <rect x="16" y="16" width="96" height="20" rx="4" fill="#0097A7"/>
  
  <!-- 浏览器控制按钮 -->
  <circle cx="26" cy="26" r="3" fill="#FF5F57"/>
  <circle cx="37" cy="26" r="3" fill="#FFBD2E"/>
  <circle cx="48" cy="26" r="3" fill="#28CA42"/>
  
  <!-- 地址栏 -->
  <rect x="58" y="22" width="48" height="8" rx="1" fill="#00BCD4" opacity="0.4"/>
  
  <!-- 列表容器 -->
  <rect x="20" y="42" width="88" height="64" rx="2" fill="white"/>
  
  <!-- 正常列表项 -->
  <rect x="24" y="48" width="80" height="12" rx="1" fill="#E0F7FA"/>
  <rect x="27" y="51" width="44" height="2" fill="#00838F"/>
  <rect x="27" y="55" width="64" height="1.5" fill="#4DD0E1"/>
  
  <rect x="24" y="63" width="80" height="12" rx="1" fill="#E0F7FA"/>
  <rect x="27" y="66" width="39" height="2" fill="#00838F"/>
  <rect x="27" y="70" width="59" height="1.5" fill="#4DD0E1"/>
  
  <!-- 广告列表项（带×） -->
  <rect x="24" y="78" width="80" height="12" rx="1" fill="#FFEBEE" stroke="#EF5350" stroke-width="2"/>
  <!-- AD标识 -->
  <rect x="27" y="79.5" width="13" height="5.5" rx="1" fill="#EF5350"/>
  <text x="33.5" y="83" font-family="Arial, sans-serif" font-size="3.8" font-weight="bold" fill="white" text-anchor="middle">AD</text>
  <rect x="42" y="81" width="35" height="2" fill="#EF5350" opacity="0.9"/>
  <rect x="42" y="85" width="40" height="1.5" fill="#EF5350" opacity="0.7"/>
  <!-- ×符号（简洁现代） -->
  <circle cx="96" cy="84" r="5" fill="#EF5350" filter="url(#shadow5)"/>
  <path d="M92 80L100 88M100 80L92 88" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 正常列表项 -->
  <rect x="24" y="93" width="80" height="12" rx="1" fill="#E0F7FA"/>
  <rect x="27" y="96" width="42" height="2" fill="#00838F"/>
  <rect x="27" y="100" width="62" height="1.5" fill="#4DD0E1"/>
</svg>

